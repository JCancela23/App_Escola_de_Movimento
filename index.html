<style>
/* Layout: app de uma coluna para telemóvel, cabeçalho com o tema do mês, navegação fixa em baixo */
:root {
  --bg: #f3f5f2; --surface: #ffffff; --fg: #17201b; --muted: #5d6a62; --line: #dbe2dc;
  --accent: #1f6b4a; --accent-fg: #ffffff; --accent-soft: #e2efe7;
  --saltar: #c98a10; --gatinhar: #138078; --empurrar: #c4513a; --puxar: #4f55b8;
  --ok: #2f8a4f; --bad: #b8432f; --warn: #b07d10;
  --display: "Barlow Condensed", "Arial Narrow", system-ui, sans-serif;
  --body: "Barlow", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #111613; --surface: #1a211d; --fg: #e6ece8; --muted: #9aa8a0; --line: #2c3631;
  --accent: #5cc08d; --accent-fg: #0d1a13; --accent-soft: #1f3529;
  --saltar: #e3a93a; --gatinhar: #3cb8ad; --empurrar: #e8775f; --puxar: #8d92ec;
  --ok: #5cc08d; --bad: #ec7a64; --warn: #e3a93a; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #111613; --surface: #1a211d; --fg: #e6ece8; --muted: #9aa8a0; --line: #2c3631;
  --accent: #5cc08d; --accent-fg: #0d1a13; --accent-soft: #1f3529;
  --saltar: #e3a93a; --gatinhar: #3cb8ad; --empurrar: #e8775f; --puxar: #8d92ec;
  --ok: #5cc08d; --bad: #ec7a64; --warn: #e3a93a; color-scheme: dark }

* { box-sizing: border-box }
:root { padding-top: env(safe-area-inset-top, 0px) }
body { margin: 0 }
[hidden] { display: none !important }
.role { cursor: pointer; border: 0 }
html, body { height: 100% }
body { background: var(--bg); color: var(--fg); font-family: var(--body); font-size: 16px; line-height: 1.45 }
button, input, select, textarea { font: inherit; color: inherit }
h1, h2, h3 { font-family: var(--display); font-weight: 700; margin: 0; text-wrap: balance; letter-spacing: .01em }
.wrap { max-width: 640px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 0 110px }

header.top { padding-block: 18px 14px; display: grid; gap: 10px }
.brand { display: flex; justify-content: space-between; align-items: center; gap: 12px }
.brand .logo { width: 40px; height: 40px; flex: none }
.brand .name { display: flex; align-items: center; gap: 10px; font-family: var(--display); font-size: 15px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted) }
.role { font-size: 13px; padding: 3px 10px; border-radius: 999px; background: var(--accent-soft); color: var(--accent); font-weight: 600; white-space: nowrap ; min-width: 0; overflow: hidden; text-overflow: ellipsis }
.tema-hero { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap }
.tema-hero h1 { font-size: 44px; line-height: 1; text-transform: uppercase }
.tema-hero .mes { color: var(--muted); font-size: 15px }
.foco { color: var(--muted); margin: 0; max-width: 60ch }

.banner { font-size: 14px; padding: 10px 12px; border-radius: 10px; background: var(--accent-soft); color: var(--fg); margin-bottom: 12px }

section { display: grid; gap: 12px; margin-top: 22px }
.sec-h { display: flex; justify-content: space-between; align-items: baseline; gap: 8px }
.sec-h h2 { font-size: 22px; text-transform: uppercase }
.sec-h .sub { color: var(--muted); font-size: 14px }

.list { display: grid; gap: 8px }
.item { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; display: grid; gap: 4px; text-align: left; width: 100% }
button.item { cursor: pointer }
button.item:hover { border-color: var(--muted) }
.row { display: flex; align-items: center; justify-content: space-between; gap: 10px; min-width: 0 }
.row > * { min-width: 0 }
.t { font-weight: 600 }
.m { color: var(--muted); font-size: 14px }
.chip { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 600; padding: 2px 9px; border-radius: 999px; border: 1px solid currentColor; white-space: nowrap }
.dot { width: 8px; height: 8px; border-radius: 50%; background: currentColor; display: inline-block }
.c-saltar { color: var(--saltar) } .c-gatinhar { color: var(--gatinhar) } .c-empurrar { color: var(--empurrar) } .c-puxar { color: var(--puxar) }
.ok { color: var(--ok) } .bad { color: var(--bad) } .warn { color: var(--warn) }

.stats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px }
.stat { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 10px; display: grid; gap: 2px }
.stat b { font-family: var(--display); font-size: 28px; line-height: 1; font-variant-numeric: tabular-nums }
.stat span { font-size: 11px; overflow-wrap: anywhere; color: var(--muted); text-transform: uppercase; letter-spacing: .05em }
@media (max-width: 440px) { .stats { grid-template-columns: repeat(2, 1fr) } }

.btn { border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 10px 14px; font-weight: 600; cursor: pointer; min-height: 44px }
.btn.primary { background: var(--accent); color: var(--accent-fg); border-color: var(--accent) }
.btn.ghost { background: transparent }
.btn.danger { color: var(--bad) }
.btn.big { width: 100%; font-size: 18px; min-height: 54px; font-family: var(--display); letter-spacing: .04em; text-transform: uppercase }
.btn:focus-visible, .seg button:focus-visible, .item:focus-visible, nav.tabs button:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px }
.btn:disabled { opacity: .5; cursor: default }

.filters { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 2px }
.filters button { flex: none; border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 6px 12px; font-size: 14px; cursor: pointer }
.filters button[aria-pressed="true"] { background: var(--fg); color: var(--bg); border-color: var(--fg) }

nav.tabs { position: fixed; left: 0; right: 0; bottom: 0; background: var(--surface); border-top: 1px solid var(--line); display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; padding-bottom: env(safe-area-inset-bottom, 0px); padding-left: env(safe-area-inset-left, 0px); padding-right: env(safe-area-inset-right, 0px); z-index: 5 }
nav.tabs button { background: none; border: 0; padding: 8px 0 10px; min-width: 0; display: grid; justify-items: center; gap: 2px; font-size: 12px; color: var(--muted); cursor: pointer }
nav.tabs button svg { width: 24px; height: 24px }
nav.tabs button[aria-current="page"] { color: var(--accent); font-weight: 600 }

/* folha (formulário) */
.sheet-bg { position: fixed; inset: 0; background: rgba(10, 16, 12, .45); z-index: 20; display: flex; align-items: flex-end; justify-content: center }
.sheet { background: var(--bg); width: 100%; max-width: 640px; max-height: 92%; overflow-y: auto; border-radius: 18px 18px 0 0; padding-block: 16px calc(20px + env(safe-area-inset-bottom, 0px)); padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: grid; gap: 14px }
.sheet h2 { font-size: 26px; text-transform: uppercase }
.field { display: grid; gap: 6px }
.field > label, .lbl { font-size: 13px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .06em }
input[type=text], input[type=date], input[type=time], input[type=url], input[type=number], input[type=month], input[type=tel], input[type=email], select, textarea { width: 100%; border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 10px 12px; min-height: 44px }
textarea { min-height: 80px; resize: vertical }
.seg { display: flex; flex-wrap: wrap; gap: 6px }
.seg button { flex: 1 1 auto; border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 10px 12px; cursor: pointer; min-height: 44px; font-weight: 500 }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); font-weight: 600 }
.seg.bad-sel button[aria-pressed="true"] { background: var(--bad); border-color: var(--bad); color: #fff }
.stepper { display: flex; align-items: center; gap: 10px }
.stepper button { width: 52px; height: 52px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); font-size: 26px; cursor: pointer }
.stepper output { font-family: var(--display); font-size: 40px; min-width: 2.2ch; text-align: center; font-variant-numeric: tabular-nums }
.actions { display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap }

/* avaliação */
.aval { display: grid; gap: 6px }
.aval .who { display: flex; justify-content: space-between; gap: 8px }
.aval .prev { font-size: 12px; color: var(--muted) }
.scale { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px }
.scale button { border: 1px solid var(--line); background: var(--surface); border-radius: 10px; min-height: 44px; font-family: var(--display); font-size: 20px; cursor: pointer }
.scale button[aria-pressed="true"] { background: var(--fg); color: var(--bg); border-color: var(--fg) }
.legend { font-size: 13px; color: var(--muted) }

table.tab { width: 100%; border-collapse: collapse; font-size: 14px; font-variant-numeric: tabular-nums }
table.tab th { text-align: left; font-size: 12px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); padding: 4px 6px; border-bottom: 1px solid var(--line) }
table.tab td { padding: 8px 6px; border-bottom: 1px solid var(--line) }
table.tab td + td, table.tab th + th { text-align: right }
@media print { nav.tabs, .btn, .seg, .banner, .toast, header .role { display: none !important } .wrap { padding-block: 0 } .item { break-inside: avoid } }
.month-grid { display: grid; gap: 8px }
.empty { color: var(--muted); padding: 16px; text-align: center; border: 1px dashed var(--line); border-radius: 12px }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(84px + env(safe-area-inset-bottom, 0px)); background: var(--fg); color: var(--bg); padding: 10px 16px; border-radius: 999px; font-weight: 600; z-index: 30; font-size: 15px }
a { color: var(--accent) }
.video-link { display: inline-flex; align-items: center; gap: 6px; font-weight: 600 }
.bar { height: 8px; border-radius: 4px; background: var(--line); overflow: hidden }
.bar i { display: block; height: 100% }
@media (prefers-reduced-motion: no-preference) { .sheet { animation: up .2s ease-out } @keyframes up { from { transform: translateY(24px); opacity: .6 } } }
</style>
</head>

<script>
const TEMAS_BASE = {
  saltar: { nome: "Saltar" }, gatinhar: { nome: "Gatinhar" },
  empurrar: { nome: "Empurrar" }, puxar: { nome: "Puxar" }
};
// temas base + temas criados pela coordenação (guardados em plano/config.temas)
const TEMAS = { ...TEMAS_BASE };
const CORES_EXTRA = ["#6b7a2f", "#8a4f9e", "#2f7bb5", "#b5562f", "#5a6b73", "#a8466e"];
function atualizarTemas() {
  Object.keys(TEMAS).forEach(k => { if (!TEMAS_BASE[k]) delete TEMAS[k]; });
  Object.entries(S.plano.config?.temas || {}).forEach(([k, v]) => { if (!TEMAS_BASE[k]) TEMAS[k] = { nome: v.nome, cor: v.cor }; });
}
const corTema = t => TEMAS_BASE[t] ? `var(--${t})` : (TEMAS[t]?.cor || "var(--muted)");
const nomeTema = t => TEMAS[t]?.nome || "Tema apagado";
const temasDe = x => !x ? [] : Array.isArray(x.temas) && x.temas.length ? x.temas : x.tema ? [x.tema] : [];
const segTemas = sel => Object.keys(TEMAS).map(t => `<button data-v="${t}" aria-pressed="${sel.includes(t)}">${esc(TEMAS[t].nome)}</button>`).join("");
// escolha de um ou mais temas (o array sel é alterado no lugar)
function ligarSegTemas(box, sel) {
  box.addEventListener("click", e => {
    const b = e.target.closest("button"); if (!b) return;
    const i = sel.indexOf(b.dataset.v);
    if (i >= 0) { if (sel.length > 1) sel.splice(i, 1); } else sel.push(b.dataset.v);
    box.querySelectorAll("button").forEach(x => x.setAttribute("aria-pressed", String(sel.includes(x.dataset.v))));
  });
}
const TEMAS_AVALIADOS = ["gatinhar", "saltar"];
const FERIAS = "Feriado ou férias";
const MOTIVOS = ["Espaço ocupado", "Treino cancelado", "Jogo da equipa sénior", "Jogo ou torneio", "Poucos atletas", "Atraso do treino", "Feriado ou férias", "Falta de preparador", "Outro"];
const CORREU = [{ v: 1, t: "Mal" }, { v: 2, t: "Razoável" }, { v: 3, t: "Bem" }, { v: 4, t: "Muito bem" }];
const ESCALA = { 1: "Não realiza", 2: "Com dificuldade", 3: "Realiza", 4: "Domina" };
const MESES = ["janeiro","fevereiro","março","abril","maio","junho","julho","agosto","setembro","outubro","novembro","dezembro"];
const DIAS = ["Dom","Seg","Ter","Qua","Qui","Sex","Sáb"];

// Estado partilhado: coleções do db, chaveadas por id
// Épocas desportivas (agosto a julho). Cada escalão pertence a uma época.
const EPOCA_INICIAL = "2026/27";
function epocaDe(iso) { const [y, m] = iso.split("-").map(Number); const a = m >= 8 ? y : y - 1; return a + "/" + String(a + 1).slice(2); }
function anoEpoca(ep) { return +ep.slice(0, 4); }
function epocaSeguinte(ep) { const a = anoEpoca(ep) + 1; return a + "/" + String(a + 1).slice(2); }
const epocaEquipa = e => e.epoca || EPOCA_INICIAL;
let epocaSel = null; // época que se está a ver (null = a atual)
const epocaVista = () => epocaSel || epocaDe(hojeISO());
function EQ(ep = epocaVista()) { return Object.fromEntries(Object.entries(S.equipas).filter(([, e]) => epocaEquipa(e) === ep)); }
function epocasConhecidas() { return [...new Set([epocaDe(hojeISO()), ...Object.values(S.equipas).map(epocaEquipa)])].sort(); }
const S = { equipas: {}, exercicios: {}, plano: {}, sessoes: {}, notas: {}, atletas: {}, avaliacoes: {}, pessoas: {}, alteracoes: {}, reunioes: {}, planos: {}, material: {}, planeadas: {}, semanas: {} };
let subExe = "exercicios";
let relPeriodo = "semana", relOffset = 0;
let db = null, demo = false;
let role = { nivel: "view", nome: "Consulta" }; // view | write | admin
let tab = "hoje", filtroTema = "todos", filtroEquipa = "todas";
let avalSel = { equipaId: null, tema: "gatinhar", mes: mesKey(new Date()) };

const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
// Hora sempre no formato HH:MM (aceita 18h30, 18.30, 1830, 9:5…)
function horaStd(v) {
  const m = String(v ?? "").trim().match(/^(\d{1,2})\s*(?:[:hH.,]\s*(\d{1,2})?|(\d{2}))?\s*(?:m|min)?$/);
  if (!m) return "";
  const h = +m[1], mi = +(m[2] ?? m[3] ?? 0);
  return h < 24 && mi < 60 ? String(h).padStart(2, "0") + ":" + String(mi).padStart(2, "0") : "";
}
function hojeISO() { const d = new Date(); return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0"); }
function mesKey(d) { return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0"); }
function mesNome(k) { const [y, m] = k.split("-"); return MESES[+m - 1] + " " + y; }
function dataCurta(iso) { const d = new Date(iso + "T12:00"); return DIAS[d.getDay()] + " " + d.getDate() + " " + MESES[d.getMonth()].slice(0, 3); }
function sorted(obj, fn) { return Object.entries(obj).map(([id, v]) => ({ id, ...v })).sort(fn); }
const FUNCOES = ["Coordenador", "Coordenador de modalidade", "Preparador físico", "Treinador", "Direção", "Outro"];
function cargo(p) { return p.funcao + (p.modalidade ? " · " + p.modalidade : ""); }
function modalidades() { return [...new Set(Object.values(EQ()).map(e => e.modalidade).filter(Boolean))].sort(); }
// Horário tipo da equipa: uma linha por dia (dia, hora, local, duração)
function horarioDe(e) {
  if (Array.isArray(e.horario)) return e.horario;
  return (e.dias || []).map(d => ({ dia: d, hora: e.hora || "", local: e.local || "", duracao: e.duracao || 20 }));
}
function horarioNoDia(e, iso) { const dow = new Date(iso + "T12:00").getDay(); return horarioDe(e).find(h => h.dia === dow) || horarioDe(e)[0] || { hora: e.hora || "", local: e.local || "", duracao: e.duracao || 20 }; }
function pessoaNome(id) { return S.pessoas[id]?.nome || ""; }
function preparadores() { return sorted(S.pessoas, (a, b) => a.nome.localeCompare(b.nome)).filter(p => p.funcao === "Preparador físico" || p.funcao === "Coordenador"); }
function equipaNome(id) { const e = S.equipas[id]; return e ? (e.modalidade + " " + (e.escalao || "")).trim() : "Equipa removida"; }
function temaDoMes(k) { return temasDe(S.plano[k])[0] || null; }
const temasDoMes = k => temasDe(S.plano[k]);
function chipTema(t) { return [].concat(t || []).filter(x => TEMAS[x]).map(x => `<span class="chip" style="color:${corTema(x)}"><span class="dot"></span>${esc(nomeTema(x))}</span>`).join(" "); }
// Três maneiras de usar: coordenação (tudo), preparador físico (regista) e consulta (pais, treinadores, direção)
let vistaComo = null; // a coordenação pode pré-visualizar as outras maneiras
const VISTAS = { admin: "Coordenação", write: "Preparador físico", view: "Pais, treinadores e direção" };
const nivel = () => role.nivel === "admin" && vistaComo ? vistaComo : role.nivel;
const podeEscrever = () => nivel() !== "view";
const podeGerir = () => nivel() === "admin";
const TABS = { admin: ["hoje", "sessoes", "exercicios", "avaliacoes", "relatorio", "mais"], write: ["hoje", "sessoes", "exercicios", "avaliacoes", "mais"], view: ["mes", "temas", "exercicios", "avaliacoes"] };
function escolherVista() {
  const el = abrirFolha(`<h2>Ver a app como</h2><span class="m">Para confirmar o que cada pessoa vê. Nada muda nos dados.</span>
    <div class="list">${Object.entries(VISTAS).map(([k, t]) => `<button class="item" data-vista="${k}"><div class="row"><span class="t">${t}</span>${nivel() === k ? `<span class="chip ok">atual</span>` : ""}</div></button>`).join("")}</div>

  el.addEventListener("click", ev => { const b = ev.target.closest("[data-vista]"); if (!b) return; vistaComo = b.dataset.vista === "admin" ? null : b.dataset.vista; fecharFolha(); tab = TABS[nivel()][0]; render(); scrollTo(0, 0); });

function toast(msg) {
  const el = document.createElement("div"); el.className = "toast"; el.textContent = msg; el.setAttribute("role", "status");
  document.body.appendChild(el); setTimeout(() => el.remove(), 2200);
}

// ---------- gravação ----------
let sb = null, sessao = null, renderTimer = null;
function agendarRender() {
  clearTimeout(renderTimer);
  renderTimer = setTimeout(() => { if (!document.activeElement?.closest?.("#view textarea, #view input")) render(); else renderHeader(); }, 60);
}
function erroPT(error) { return error?.code === "42501" || /row-level security/i.test(error?.message || "") ? "sem permissão" : "verifique a ligação à internet"; }
async function guardar(col, id, data) {
  if (demo) { S[col][id] = data; render(); return; }
  const { error } = await sb.from(col).upsert({ id, data });
  if (error) { toast("Não foi possível guardar: " + erroPT(error)); throw error; }
  S[col][id] = data; agendarRender();
}
async function apagar(col, id) {
  if (demo) { delete S[col][id]; render(); return; }
  const { error } = await sb.from(col).delete().eq("id", id);
  if (error) return toast("Não foi possível apagar: " + erroPT(error));
  delete S[col][id]; agendarRender();
}
const novoId = p => p + "_" + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);

// ---------- HORÁRIO: semanal fixo + alterações pontuais ----------
function isoDe(d) { return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0"); }
function somaDias(iso, n) { const d = new Date(iso + "T12:00"); d.setDate(d.getDate() + n); return isoDe(d); }
// Sessões previstas entre duas datas (inclusive), já com mudanças e cancelamentos aplicados
function previstas(de, ate) {
  const out = [];
  for (let d = de; d <= ate; d = somaDias(d, 1)) {
    const dow = new Date(d + "T12:00").getDay();
    const ep = epocaDe(d);
    Object.entries(S.equipas).forEach(([eid, e]) => {
      if (e.ativa === false || epocaEquipa(e) !== ep) return; // ainda não arrancou ou é de outra época
      const h = horarioDe(e).find(x => x.dia === dow);
      if (!h) return;
      const alt = S.alteracoes[eid + "_" + d];
      if (alt?.novaData) return; // passou para outro dia
      out.push({ equipaId: eid, data: d, hora: alt?.novaHora || h.hora || "", local: alt?.novoLocal || h.local || "", duracao: alt?.novaDuracao || h.duracao || 20, mudouHora: !!alt?.novaHora, mudouLocal: !!alt?.novoLocal, cancelada: !!alt?.cancelada, motivo: alt?.motivo || "", altId: alt ? eid + "_" + d : null, original: d });
    });
  }
  Object.entries(S.alteracoes).forEach(([id, a]) => {
    if (a.novaData && a.novaData >= de && a.novaData <= ate && S.equipas[a.equipaId])
      out.push({ equipaId: a.equipaId, data: a.novaData, hora: a.novaHora || horarioNoDia(S.equipas[a.equipaId], a.data).hora || "", local: a.novoLocal || horarioNoDia(S.equipas[a.equipaId], a.data).local || "", duracao: a.novaDuracao || horarioNoDia(S.equipas[a.equipaId], a.data).duracao || 20, motivo: a.motivo || "", mudouLocal: !!a.novoLocal, cancelada: false, mudada: a.data, altId: id, original: a.data });
  });
  return out.sort((a, b) => a.data.localeCompare(b.data) || a.hora.localeCompare(b.hora));
}
function sessaoDe(p) { return Object.entries(S.sessoes).map(([id, v]) => ({ id, ...v })).find(s => s.equipaId === p.equipaId && s.data === p.data); }
function itemPrevista(p) {
  const e = S.equipas[p.equipaId], s = sessaoDe(p);
  const estado = s ? (s.estado === "dada" ? `<span class="chip ok">Dada · ${s.nAtletas}</span>` : `<span class="chip bad">Não dada</span>`)
    : p.cancelada ? `<span class="chip bad">Cancelada</span>` : p.data <= hojeISO() ? `<span class="chip warn">Por registar</span>` : "";
  const extra = p.mudada && !p.cancelada ? ` · mudada de ${dataCurta(p.mudada)}${p.motivo ? " (" + esc(p.motivo) + ")" : ""}` : p.cancelada ? ` · ${esc(p.motivo)}` : "";
  return `<div class="item">
    <div class="row"><span class="t">${esc(e.modalidade)} ${esc(e.escalao)}</span>${estado}</div>
    <span class="m">${esc(s?.hora || p.hora)} · ${esc(s?.local || p.local)}${p.mudouLocal ? " (local alterado)" : ""} · ${s?.duracao || p.duracao} min${pessoaNome(e.responsavel) ? " · " + esc(pessoaNome(e.responsavel)) : ""}${extra}</span>
    ${podeEscrever() ? `<div class="actions" style="justify-content:flex-start">
      ${s ? `<button class="btn" data-act="verSessao" data-id="${s.id}">Ver registo</button>` : p.cancelada || p.data > hojeISO() ? "" : `<button class="btn primary" data-act="registarPrev" data-id="${p.equipaId}" data-data="${p.data}">Registar</button>`}
      ${s ? "" : `<button class="btn ghost" data-act="alterar" data-id="${p.equipaId}" data-data="${p.original}">Alterar</button>`}
      ${p.cancelada ? "" : planoDaSessao(p.equipaId, p.data) ? `<button class="btn" data-act="planoSessao" data-id="${p.equipaId}" data-data="${p.data}">Ver plano</button>` : podeGerir() ? `<button class="btn ghost" data-act="planoSessao" data-id="${p.equipaId}" data-data="${p.data}">Escolher plano</button>` : `<span class="m">Sem plano</span>`}</div>`
      : s ? `<button class="btn ghost" data-act="verSessao" data-id="${s.id}" style="justify-self:start">Ver sessão</button>` : ""}
  </div>`;
}
function formAlteracao(equipaId, data) {

    <span class="m">${esc(e.modalidade)} ${esc(e.escalao)} · prevista para ${dataCurta(data)} às ${esc(e.hora || "")}</span>

      <div class="field" style="flex:1"><label for="aHora">Nova hora</label><input type="time" step="300" id="aHora" value="${horaStd(a.novaHora || e.hora)}"></div></div>

      <div class="field" style="flex:1"><label for="aDur">Duração (min)</label><input type="number" id="aDur" value="${a.novaDuracao || e.duracao || 20}"></div></div>
    <div id="aCanc" class="field"><span class="lbl">Motivo</span><div class="seg bad-sel" id="aMot">${MOTIVOS.map(m => `<button data-v="${esc(m)}">${esc(m)}</button>`).join("")}</div></div>
    <span class="m">Só muda esta semana. O horário habitual muda-se em Mais › Equipas.</span>
    <div class="actions">${S.alteracoes[id] ? `<button class="btn danger" id="aRepor">Repor horário normal</button>` : ""}<button class="btn" data-close>Cancelar</button><button class="btn primary" id="aOk">Guardar</button></div>`);
  const sync = () => {
    $("#aModo", el).querySelectorAll("button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.v === modo)));

  };
  $("#aModo", el).addEventListener("click", ev => { const b = ev.target.closest("button"); if (b) { modo = b.dataset.v; sync(); } });
  $("#aMot", el).addEventListener("click", ev => { const b = ev.target.closest("button"); if (b) { motivo = b.dataset.v; sync(); } });
  sync();
  $("#aOk", el).addEventListener("click", async () => {
    let dados = { equipaId, data };
    if (modo === "cancelar") dados = { ...dados, cancelada: true, motivo: motivo || "Outro" };
    else {
      const nd = $("#aData", el).value || data, nh = $("#aHora", el).value.trim();
      if (nd !== data) dados.novaData = nd;
      if (nh && nh !== e.hora) dados.novaHora = nh;

      if (ndur && ndur !== (e.duracao || 20)) dados.novaDuracao = ndur;

      if (!dados.novaData && !dados.novaHora && !dados.novoLocal && !dados.novaDuracao) { if (S.alteracoes[id]) await apagar("alteracoes", id); fecharFolha(); return; }
    }
    try { await guardar("alteracoes", id, dados); fecharFolha(); toast("Alteração guardada"); } catch (err) {}
  });
  $("#aRepor", el)?.addEventListener("click", () => { apagar("alteracoes", id); fecharFolha(); toast("Horário normal reposto"); });
}

function inicioEpoca() { const c = S.plano.config || {}; return c.inicios?.[epocaVista()] || (epocaVista() === EPOCA_INICIAL ? c.inicioEpoca : null) || null; }
// Sessões do horário que já passaram e ainda não têm registo
function emAtraso() {
  const ini = inicioEpoca(), ontem = somaDias(hojeISO(), -1);
  if (!ini || ini > ontem) return [];
  return previstas(ini, ontem).filter(p => !p.cancelada && !sessaoDe(p));
}
function abrirAtraso() {
  const lista = emAtraso();
  let html = `<h2>Sessões em atraso</h2>`;
  if (!inicioEpoca()) html += podeGerir()
    ? `<span class="m">Indique quando começou a época para a app saber que sessões já deviam ter acontecido.</span><div class="field"><label for="iniEp">Início da época</label><input type="date" id="iniEp" value="${anoEpoca(epocaVista())}-09-15"></div><button class="btn primary" id="iniOk">Guardar</button>`
    : `<span class="m">O coordenador ainda não indicou a data de início da época.</span>`;
  else if (!lista.length) html += `<div class="empty">Está tudo registado desde ${dataCurta(inicioEpoca())}.</div>`;
  else {
    html += `<span class="m">${lista.length} sessão(ões) do horário desde ${dataCurta(inicioEpoca())} sem registo. Toque numa para registar como dada ou não dada. Sessões fora do horário registam-se em Registar sessão.</span><div class="list">`;
    let sem = "";
    lista.slice().reverse().forEach(p => {
      const d = new Date(p.data + "T12:00"), seg = somaDias(p.data, -((d.getDay() + 6) % 7));
      if (seg !== sem) { sem = seg; html += `<div class="lbl" style="margin-top:6px">Semana de ${dataCurta(seg)}</div>`; }
      html += `<button class="item" data-atraso="${p.equipaId}|${p.data}"><div class="row"><span class="t">${esc(equipaNome(p.equipaId))}</span><span class="m">${dataCurta(p.data)}</span></div><span class="m">${esc(p.hora)} · ${esc(p.local)}</span></button>`;
    });
    html += `</div>`;
  }
  if (podeEscrever()) html += `<button class="btn" id="atrasoLivre">Registar outra sessão passada (escolher equipa, dia, hora e local)</button>`;
  html += `<div class="actions"><button class="btn" data-close>Fechar</button></div>`;
  const el = abrirFolha(html);
  $("#atrasoLivre", el)?.addEventListener("click", () => formSessao({ data: somaDias(hojeISO(), -1), depois: abrirAtraso }));
  $("#iniOk", el)?.addEventListener("click", async () => {
    try { await guardar("plano", "config", { ...(S.plano.config || {}), inicios: { ...(S.plano.config?.inicios || {}), [epocaVista()]: $("#iniEp", el).value } }); abrirAtraso(); } catch (e) {}
  });
  el.addEventListener("click", ev => {
    const b = ev.target.closest("[data-atraso]"); if (!b) return;
    const [eid, data] = b.dataset.atraso.split("|");

    formSessao({ equipaId: eid, data, hora: pv.hora, local: pv.local, duracao: pv.duracao, depois: abrirAtraso });
  });
}

// ---------- RELATÓRIO ----------
function inicioEpocaOuSetembro() {
  if (inicioEpoca()) return inicioEpoca();
  return anoEpoca(epocaVista()) + "-09-01";
}
function periodoRel() {
  const hoje = new Date();
  if (relPeriodo === "epoca") { const de = inicioEpocaOuSetembro(), fim = (anoEpoca(epocaVista()) + 1) + "-07-31", ate = fim < hojeISO() ? fim : hojeISO(); return { de, ate, nome: `Época ${epocaVista()}: ${dataCurta(de)} a ${dataCurta(ate)}` }; }
  if (relPeriodo === "mes") {
    const d = new Date(hoje.getFullYear(), hoje.getMonth() + relOffset, 1);
    const fim = new Date(d.getFullYear(), d.getMonth() + 1, 0);
    return { de: isoDe(d), ate: isoDe(fim), nome: mesNome(mesKey(d)) };
  }
  const seg = new Date(hoje); seg.setDate(hoje.getDate() - ((hoje.getDay() + 6) % 7) + relOffset * 7);
  const dom = new Date(seg); dom.setDate(seg.getDate() + 6);
  return { de: isoDe(seg), ate: isoDe(dom), nome: `${seg.getDate()} ${MESES[seg.getMonth()].slice(0, 3)} a ${dom.getDate()} ${MESES[dom.getMonth()].slice(0, 3)}` };
}
function calcRelatorio() {
  const P = periodoRel(), limite = P.ate < hojeISO() ? P.ate : hojeISO();
  // só conta sessões previstas a partir do primeiro registo feito na app
  const inicio = inicioEpoca() || Object.values(S.sessoes).reduce((m, s) => s.data < m ? s.data : m, hojeISO());
  const de = P.de > inicio ? P.de : inicio;
  const prev = de <= limite ? previstas(de, limite) : [];
  const regs = Object.entries(S.sessoes).map(([id, v]) => ({ id, ...v })).filter(s => s.data >= P.de && s.data <= P.ate);
  const linhas = []; // uma linha por sessão (prevista ou registada fora do horário)
  const usados = new Set();
  prev.forEach(p => {
    const s = regs.find(r => r.equipaId === p.equipaId && r.data === p.data);
    if (s) { usados.add(s.id); linhas.push({ ...p, estado: s.estado, motivo: s.motivo, nAtletas: +s.nAtletas || 0, dadaPor: s.dadaPor }); }
    else if (p.cancelada) linhas.push({ ...p, estado: "nao_dada", motivo: p.motivo });
    else linhas.push({ ...p, estado: "por_registar" });
  });
  regs.filter(s => !usados.has(s.id)).forEach(s => linhas.push({ equipaId: s.equipaId, data: s.data, estado: s.estado, motivo: s.motivo, nAtletas: +s.nAtletas || 0, dadaPor: s.dadaPor, extra: true }));
  linhas.forEach(l => { if (l.estado === "nao_dada" && l.motivo === FERIAS) l.estado = "ferias"; });
  const dadas = linhas.filter(l => l.estado === "dada"), nao = linhas.filter(l => l.estado === "nao_dada"), porReg = linhas.filter(l => l.estado === "por_registar"), ferias = linhas.filter(l => l.estado === "ferias");
  const atletas = dadas.reduce((a, l) => a + l.nAtletas, 0);
  const porMod = {};
  linhas.filter(l => l.estado !== "ferias").forEach(l => {
    const e = S.equipas[l.equipaId]; const k = e ? e.modalidade + " " + e.escalao : "Equipa removida";
    const m = porMod[k] = porMod[k] || { dadas: 0, nao: 0, porReg: 0, atletas: 0 };
    if (l.estado === "dada") { m.dadas++; m.atletas += l.nAtletas; } else if (l.estado === "nao_dada") m.nao++; else m.porReg++;
  });
  const porPessoa = {}; dadas.forEach(l => { const n = pessoaNome(l.dadaPor) || "Não indicado"; porPessoa[n] = (porPessoa[n] || 0) + 1; });
  const motivos = {}; nao.forEach(l => { const m = l.motivo || "Outro"; motivos[m] = (motivos[m] || 0) + 1; });
  const temas = {}; regs.filter(r => r.estado === "dada").forEach(r => { const l = temasDe(r); (l.length ? l.map(nomeTema) : ["Sem tema"]).forEach(t => temas[t] = (temas[t] || 0) + 1); });
  const ativas = Object.values(EQ()).filter(e => e.ativa !== false);
  const modalidadesAbr = [...new Set(ativas.map(e => e.modalidade))].sort();
  const escaloes = ativas.length;
  const deReun = relPeriodo === "epoca" ? anoEpoca(epocaVista()) + "-08-01" : P.de;
  const reun = Object.values(S.reunioes).filter(r => r.data >= deReun && r.data <= P.ate).sort((a, b) => a.data.localeCompare(b.data));
  const tarefas = reun.flatMap(r => r.tarefas || []);
  const aval = {}; Object.values(S.avaliacoes).filter(a => a.mes >= P.de.slice(0, 7) && a.mes <= P.ate.slice(0, 7)).forEach(a => {
    const v = Object.values(a.resultados || {}).filter(Boolean); if (!v.length) return;
    const t = nomeTema(a.tema); const x = aval[t] = aval[t] || { soma: 0, n: 0 }; x.soma += v.reduce((p, q) => p + q, 0); x.n += v.length; });
  return { P, linhas, dadas, nao, porReg, ferias, atletas, porMod, porPessoa, motivos, temas, modalidadesAbr, escaloes, reun, tarefas, aval };
}
function barras(obj, cor, total) {
  return Object.entries(obj).sort((a, b) => b[1] - a[1]).map(([k, n]) =>
    `<div class="row"><span class="m">${esc(k)}</span><span class="t">${n}</span></div><div class="bar"><i style="width:${n / (total || 1) * 100}%;background:${cor}"></i></div>`).join("");
}
function viewRelatorio() {
  const R = calcRelatorio(), fechadas = R.dadas.length + R.nao.length;
  const pct = fechadas ? Math.round(R.dadas.length / fechadas * 100) : 0;
  let html = `<section><div class="sec-h"><h2>Relatório</h2></div>
    <div class="seg" id="relP"><button data-v="semana" aria-pressed="${relPeriodo === "semana"}">Semanal</button><button data-v="mes" aria-pressed="${relPeriodo === "mes"}">Mensal</button><button data-v="epoca" aria-pressed="${relPeriodo === "epoca"}">Toda a época</button></div>
    ${relPeriodo === "epoca" ? `<div class="row"><span class="t">${R.P.nome}</span></div>` : `<div class="row"><button class="btn" data-rel="-1" aria-label="Período anterior">‹</button><span class="t">${R.P.nome}</span><button class="btn" data-rel="1" aria-label="Período seguinte" ${relOffset >= 0 ? "disabled" : ""}>›</button></div>`}
    <div class="stats">
      <div class="stat"><b class="ok">${R.dadas.length}</b><span>Dadas</span></div>
      <div class="stat"><b class="bad">${R.nao.length}</b><span>Não dadas</span></div>
      <div class="stat"><b>${pct}%</b><span>Cumprimento</span></div>
      <div class="stat"><b>${R.atletas}</b><span>Presenças</span></div>
    </div>
    ${R.ferias.length ? `<span class="m">${R.ferias.length} sessão(ões) sem efeito por férias ou feriados (não contam como não dadas).</span>` : ""}
    ${R.porReg.length ? `<div class="banner">${R.porReg.length} sessão(ões) prevista(s) ainda sem registo.</div>` : ""}
  </section>`;
  html += `<section><div class="sec-h"><h2>Onde está implementada</h2></div><div class="item"><span class="t">${R.modalidadesAbr.length} modalidades · ${R.escaloes} escalões</span><span class="m">${R.modalidadesAbr.map(esc).join(", ")}</span></div></section>`;

}

// ---------- PLANOS DE SESSÃO E MATERIAL ----------
function segundaDe(iso) { const d = new Date(iso + "T12:00"); return somaDias(iso, -((d.getDay() + 6) % 7)); }
// Plano de uma sessão: o escolhido para essa sessão ou, se não houver, o plano da semana
function planoDaSessao(equipaId, data) {
  const id = S.planeadas[equipaId + "_" + data]?.planoId || S.semanas[segundaDe(data)]?.planoId;
  return id && S.planos[id] ? { id, ...S.planos[id] } : null;
}
const PARTES = [["aquecimento", "Aquecimento"], ["principal", "Parte principal"]];
const parteDe = i => i.parte === "aquecimento" ? "aquecimento" : "principal";
function htmlPlano(pl) {
  const itens = (pl.itens || []).filter(i => S.exercicios[i.exercicioId]);
  const bloco = (k, nome) => { const l = itens.filter(i => parteDe(i) === k); return `<div class="field"><span class="lbl">${nome}</span><div class="list">${l.map((i, n) => { const x = S.exercicios[i.exercicioId]; return `<div class="item">
      <div class="row"><span class="t">${n + 1}. ${esc(x.nome)}</span>${i.dose ? `<span class="chip" style="color:var(--accent)">${esc(i.dose)}</span>` : ""}</div>
      ${x.descricao ? `<span class="m">${esc(x.descricao)}</span>` : ""}
      ${i.obs ? `<span><b>Obs.:</b> ${esc(i.obs)}</span>` : ""}
      ${x.video ? `<a class="video-link" href="${esc(x.video)}" target="_blank" rel="noopener">▶ Ver vídeo</a>` : ""}</div>`; }).join("") || `<div class="empty">Sem exercícios.</div>`}</div></div>`; };
  return `${chipTema(temasDe(pl))}${PARTES.map(([k, n]) => bloco(k, n)).join("")}
    ${(pl.material || []).length ? `<div class="field"><span class="lbl">Material</span>${pl.material.filter(m => S.material[m.materialId]).map(m => `<span>• ${esc(S.material[m.materialId].nome)}${m.qtd ? " × " + esc(m.qtd) : ""}</span>`).join("")}</div>` : ""}
    ${pl.notas ? `<div class="field"><span class="lbl">Notas</span><span style="white-space:pre-line">${esc(pl.notas)}</span></div>` : ""}`;
}
function verPlanoSessao(eid, data) {
  const pl = planoDaSessao(eid, data), propria = S.planeadas[eid + "_" + data]?.planoId;
  const el = abrirFolha(`<h2>Plano da sessão</h2><span class="m">${esc(equipaNome(eid))} · ${dataCurta(data)}</span>
    ${pl ? `<span class="t">${esc(pl.nome)}</span><span class="m">${propria ? "Escolhido para esta sessão" : "Plano da semana"}</span>${htmlPlano(pl)}` : `<div class="empty">Ainda não há plano para esta sessão.</div>`}
    ${podeGerir() ? `<div class="field"><label for="psSel">Plano desta sessão</label><select id="psSel"><option value="">Usar o plano da semana</option>${sorted(S.planos, (a, b) => a.nome.localeCompare(b.nome)).map(x => `<option value="${x.id}" ${x.id === propria ? "selected" : ""}>${esc(x.nome)}</option>`).join("")}</select></div>` : ""}
    <div class="actions">${podeGerir() && pl ? `<button class="btn" id="psEdit">Editar plano</button>` : ""}<button class="btn" data-close>Fechar</button></div>`);
  $("#psSel", el)?.addEventListener("change", async ev => {
    const id = eid + "_" + data;
    if (ev.target.value) await guardar("planeadas", id, { planoId: ev.target.value, equipaId: eid, data }).catch(() => {});

function viewPlanos() {
  const lista = sorted(S.planos, (a, b) => a.nome.localeCompare(b.nome));
  let html = `<section><div class="sec-h"><h2>Planos de sessão</h2><span class="sub">${lista.length}</span></div>
    <span class="m">Cada plano é a prescrição da sessão: aquecimento e parte principal, com exercícios da base de dados, tempo ou repetições, observações e material. Escolhe-se um plano para a semana inteira (em Mais › Plano anual, ao preparar o mês) e, se for preciso, outro para uma sessão em particular.</span>`;
  if (podeGerir()) {
    html += `<button class="btn primary" data-act="novoPlano">Novo plano</button><div class="item"><span class="lbl">Plano de cada semana</span>`;
    const seg0 = segundaDe(hojeISO());
    for (let i = -1; i < 7; i++) {
      const sg = somaDias(seg0, i * 7), atual = S.semanas[sg]?.planoId || "";

      <span class="m">Aquecimento ${nAq} · parte principal ${n - nAq}${(pl.material || []).length ? " · " + pl.material.length + " material" : ""}${semanas.length ? " · semana de " + semanas.map(k => dataCurta(k).slice(4)).join(", ") : ""}</span></button>`;
  });
  if (!lista.length) html += `<div class="empty">Ainda não há planos.${podeGerir() ? " Crie o primeiro com Novo plano." : ""}</div>`;

}
function verPlano(id) {

function optExercicios(sel, tema) {
  const exs = sorted(S.exercicios, (a, b) => a.nome.localeCompare(b.nome)), op = x => `<option value="${x.id}" ${x.id === sel ? "selected" : ""}>${esc(x.nome)}</option>`;

    + (exs.some(x => !TEMAS[x.tema]) ? `<optgroup label="Outros">${exs.filter(x => !TEMAS[x.tema]).map(op).join("")}</optgroup>` : "");

function linhaItem(i, tema) {

function editorItens(itens, tema) {

function ligarEditorItens(el, tema) {

const lerItens = el => [...el.querySelectorAll("[data-item]")].map(r => ({ parte: r.dataset.parte, exercicioId: r.querySelector(".iEx").value, dose: r.querySelector(".iDose").value.trim(), obs: r.querySelector(".iObs").value.trim() })).filter(i => i.exercicioId);

  bg.innerHTML = `<div class="sheet" role="dialog" aria-modal="true">${html}</div>`;

}

// ---------- render e eventos ----------
function render() {
  atualizarTemas();
  const tabs = TABS[nivel()];
  document.querySelectorAll("nav.tabs button").forEach(b => b.hidden = !tabs.includes(b.dataset.tab));
  if (!tabs.includes(tab)) tab = tabs[0];
  renderHeader();
  const v = { mes: viewMes, temas: viewTemas, relatorio: viewRelatorio, hoje: viewHoje, sessoes: viewSessoes, exercicios: viewExercicios, avaliacoes: viewAvaliacoes, mais: viewMais }[tab];
  $("#view").innerHTML = v();
  document.querySelectorAll("nav.tabs button").forEach(b => b.dataset.tab === tab ? b.setAttribute("aria-current", "page") : b.removeAttribute("aria-current"));
}
function irPara(t) { tab = t; try { localStorage.setItem("em_tab", t); } catch (e) {} render(); scrollTo(0, 0); }
document.querySelector("nav.tabs").addEventListener("click", e => { const b = e.target.closest("button"); if (b) irPara(b.dataset.tab); });
$("#view").addEventListener("click", e => {
  const go = e.target.closest("[data-tab-go]"); if (go) return irPara(go.dataset.tabGo);
  const sbx = e.target.closest("[data-sub]"); if (sbx) { subExe = sbx.dataset.sub; return render(); }
  const ft = e.target.closest("[data-ftema]"); if (ft) { filtroTema = ft.dataset.ftema; return render(); }
  const fe = e.target.closest("[data-feq]"); if (fe) { filtroEquipa = fe.dataset.feq; return render(); }
  const sc = e.target.closest(".scale button");
  if (sc) {
    const aid = sc.parentElement.dataset.atleta, n = +sc.dataset.n;
    guardarAval(d => { d.resultados[aid] = d.resultados[aid] === n ? null : n; });
    const v = avalPendente.dados.resultados[aid];
    sc.parentElement.querySelectorAll("button").forEach(b => b.setAttribute("aria-pressed", String(+b.dataset.n === v)));
    return;
  }
  if (e.target.closest("#aTema button")) { avalSel.tema = e.target.closest("button").dataset.v; return render(); }
  if (e.target.id === "aAdd") {
    const nomes = $("#aNovos").value.split("\n").map(s => s.trim()).filter(Boolean);
    (async () => { for (const nome of nomes) { try { await guardar("atletas", novoId("a"), { nome, equipaId: avalSel.equipaId }); } catch (err) { break; } } toast(nomes.length + " atleta(s) adicionados"); render(); })();
    return;
  }
  const sb2 = e.target.closest("[data-sem]"); if (sb2) { semOffset += +sb2.dataset.sem; return render(); }
  if (e.target.closest("#relP button")) { relPeriodo = e.target.closest("button").dataset.v; relOffset = 0; return render(); }
  const rb = e.target.closest("[data-rel]"); if (rb) { relOffset = Math.min(0, relOffset + +rb.dataset.rel); return render(); }
  const epb = e.target.closest("[data-ep]"); if (epb) { epocaSel = epb.dataset.ep === epocaDe(hojeISO()) ? null : epb.dataset.ep; avalSel.equipaId = null; filtroEquipa = "todas"; return render(); }
  if (e.target.id === "epNova") {
    const b = e.target; if (!b.dataset.armed) { b.dataset.armed = 1; b.textContent = "Confirmar: preparar a época " + epocaSeguinte(epocaDe(hojeISO())); return; }
    (async () => {
      const de = epocaDe(hojeISO()), para = epocaSeguinte(de), ano = anoEpoca(para);
      for (const [id, eq] of Object.entries(EQ(de))) {
        try { await guardar("equipas", id.replace(/-\d{4}$/, "") + "-" + ano, { ...JSON.parse(JSON.stringify(eq)), epoca: para }); } catch (err) { return; }
      }
      epocaSel = para; toast("Época " + para + " preparada"); render();
    })();
    return;
  }
  if (e.target.id === "relImprimir") { window.print(); return; }
  if (e.target.id === "addTema") {
    const nome = $("#novoTema").value.trim(), id = nome.normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "");
    if (!id) return toast("Escreva o nome do tema");
    if (TEMAS[id]) return toast("Esse tema já existe");
    const cfg = JSON.parse(JSON.stringify(S.plano.config || {})); cfg.temas = cfg.temas || {};
    cfg.temas[id] = { nome, cor: CORES_EXTRA[Object.keys(cfg.temas).length % CORES_EXTRA.length] };
    guardar("plano", "config", cfg).then(() => toast("Tema " + nome + " criado"), () => {}); return;
  }
  const rt = e.target.closest("[data-rmtema]");
  if (rt) {
    if (!rt.dataset.armed) { rt.dataset.armed = 1; rt.textContent = "Confirmar"; return; }
    const cfg = JSON.parse(JSON.stringify(S.plano.config || {})); delete (cfg.temas || {})[rt.dataset.rmtema];
    guardar("plano", "config", cfg).then(() => toast("Tema apagado"), () => {}); return;
  }
  const tk = e.target.closest("[data-tarefa]");
  if (tk) { const [rid, i] = tk.dataset.tarefa.split("|"); const r = JSON.parse(JSON.stringify(S.reunioes[rid])); r.tarefas[+i].feito = !r.tarefas[+i].feito; guardar("reunioes", rid, r).then(() => toast(r.tarefas[+i].feito ? "Tarefa concluída" : "Tarefa reaberta"), () => {}); return; }
  if (e.target.id === "relCopiar") { const t = textoRelatorio(); try { navigator.clipboard.writeText(t).then(() => toast("Relatório copiado"), () => abrirFolha(`<h2>Relatório</h2><textarea style="min-height:300px">${esc(t)}</textarea><div class="actions"><button class="btn" data-close>Fechar</button></div>`)); } catch (err) { abrirFolha(`<h2>Relatório</h2><textarea style="min-height:300px">${esc(t)}</textarea><div class="actions"><button class="btn" data-close>Fechar</button></div>`); } return; }
  if (e.target.id === "entrar") return formLogin();
  if (e.target.id === "sair") { sb.auth.signOut(); return; }
  if (e.target.id === "copiarLink") { const u = location.origin + location.pathname; try { navigator.clipboard.writeText(u).then(() => toast("Link copiado"), () => toast(u)); } catch (err) { toast(u); } return; }
  if (e.target.id === "acAdd") {
    const email = $("#acEmail").value.trim().toLowerCase();
    if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)) return toast("Escreva um email válido");
    (async () => {
      const { error } = await sb.from("acessos").upsert({ id: email, papel: $("#acPapel").value, nome: $("#acNome").value.trim() });
      if (error) return toast("Não foi possível dar acesso: " + erroPT(error));
      await carregar("acessos"); render(); toast("Acesso dado a " + email);
    })();
    return;
  }
  const rm = e.target.closest("[data-rmacesso]");
  if (rm) {
    if (!rm.dataset.armed) { rm.dataset.armed = 1; rm.textContent = "Confirmar"; return; }
    (async () => { const { error } = await sb.from("acessos").delete().eq("id", rm.dataset.rmacesso); if (error) return toast("Não foi possível remover"); await carregar("acessos"); render(); })();
    return;
  }
  if (e.target.id === "limparEx") { Object.entries(S.sessoes).filter(([, s]) => s.exemplo).forEach(([id]) => apagar("sessoes", id)); toast("Exemplos apagados"); return; }
  const a = e.target.closest("[data-act]"); if (!a || a.disabled) return;
  const id = a.dataset.id;
  ({
    atraso: () => abrirAtraso(),
    planoSessao: () => verPlanoSessao(id, a.dataset.data), verPlano: () => verPlano(id), novoPlano: () => formPlano(),
    novoMaterial: () => formMaterial(), editMaterial: () => formMaterial(id),
    verEquipa: () => verEquipa(id),
    reuniao: () => formReuniao(id),
    registarPrev: () => { const pv = previstas(a.dataset.data, a.dataset.data).find(x => x.equipaId === id) || {}; formSessao({ equipaId: id, data: a.dataset.data, hora: pv.hora, local: pv.local, duracao: pv.duracao }); },
    alterar: () => formAlteracao(id, a.dataset.data),
    registar: () => formSessao(id && S.equipas[id] ? { equipaId: id } : null),
    verSessao: () => verSessao(id), verExercicio: () => verExercicio(id), novoExercicio: () => formExercicio(),
    editPlano: () => editPlano(id), editEquipa: () => editEquipa(id), verPessoa: () => verPessoa(id), editPessoa: () => editPessoa(id)
  })[a.dataset.act]?.();
});
$("#view").addEventListener("change", e => {
  if (e.target.dataset.semana) { const sg = e.target.dataset.semana, v = e.target.value; (v ? guardar("semanas", sg, { planoId: v }) : apagar("semanas", sg)).then(() => toast("Plano da semana guardado"), () => {}); return; }
  if (e.target.id === "aEq") { avalSel.equipaId = e.target.value; render(); }
  if (e.target.id === "aMes" && e.target.value) { avalSel.mes = e.target.value; render(); }
});
$("#view").addEventListener("input", e => { if (e.target.id === "aObs") { const v = e.target.value; guardarAval(d => { d.obs = v; }); } });

// ---------- dados de demonstração (só quando o db não está disponível) ----------
function carregarDemo() {
  demo = true; role = { nivel: "admin", nome: "Coordenação" };
  if (!window.EM_SIMULACAO) { const sc = document.createElement("script"); sc.src = "simulacao.js"; sc.onload = () => window.EM_SIMULACAO ? carregarDemo() : null; sc.onerror = () => { window.EM_SIMULACAO = "falhou"; carregarDemo(); }; document.head.appendChild(sc); return; }
  if (typeof window.EM_SIMULACAO === "function") { window.EM_SIMULACAO(S); return render(); }
  const k = mesKey(new Date()), dow = new Date().getDay();
  [["Andebol", "Sub-12"], ["Futsal", "Sub-10"], ["Basquetebol", "Sub-12"], ["Voleibol", "Sub-13"], ["Hóquei em patins", "Sub-11"], ["Natação", "Sub-12"]]
    .forEach(([m, e], i) => S.equipas["e" + i] = { modalidade: m, escalao: e, dias: [((dow + i) % 5) + 1, i < 3 ? dow : 6], hora: "18:" + (i * 10 % 60 + "").padStart(2, "0"), duracao: i % 2 ? 20 : 30, local: "Pavilhão" });
  S.pessoas.p1 = { nome: "João Cancela", funcao: "Coordenador", telefone: "912 000 000", email: "exemplo@clube.pt" }; S.pessoas.p2 = { nome: "Treinador Exemplo", funcao: "Treinador", telefone: "913 000 000" }; S.equipas.e0.responsavel = "p1"; S.equipas.e0.treinadores = ["p2"];
  S.exercicios.x1 = { nome: "Saltos ao pé coxinho", tema: "saltar", duracao: 5, descricao: "Saltar num só apoio ao longo de 10 m e trocar de pé." };
  S.exercicios.x2 = { nome: "Urso (bear crawl)", tema: "gatinhar", duracao: 5, descricao: "Mãos e pés no chão, joelhos a um palmo do solo, avançar 10 m." };
  S.plano[k] = { tema: "gatinhar", foco: "Exemplo de foco do mês", exercicios: ["x2"] };
  S.sessoes.s1 = { data: hojeISO(), equipaId: "e0", estado: "dada", nAtletas: 14, correu: 3, tema: "gatinhar", exercicios: ["x2"], resumo: "Exemplo", exemplo: true, criadoEm: 1 };
  render();
}

// ---------- login ----------
function formLogin() {
  const el = abrirFolha(`<h2>Entrar</h2>
    <span class="m">Só para a equipa técnica. Pais, treinadores e direção podem ver tudo sem entrar.</span>
    <div class="field"><label for="lEmail">Email</label><input type="email" id="lEmail" autocomplete="email"></div>
    <div class="field"><label for="lPass">Password</label><input type="password" id="lPass" autocomplete="current-password"></div>
    <p class="m" id="lMsg" role="status"></p>
    <div class="actions"><button class="btn" id="lNova">Criar conta</button><button class="btn primary" id="lOk">Entrar</button></div>
    <span class="m">Primeira vez? Escreva o email que o coordenador registou, escolha uma password (mínimo 6 caracteres) e toque em Criar conta.</span>`);
  const msg = t => $("#lMsg", el).textContent = t;
  const dados = () => ({ email: $("#lEmail", el).value.trim().toLowerCase(), password: $("#lPass", el).value });
  $("#lOk", el).addEventListener("click", async () => {
    msg("A entrar…");
    const { error } = await sb.auth.signInWithPassword(dados());
    if (error) return msg(/invalid/i.test(error.message) ? "Email ou password errados." : /confirm/i.test(error.message) ? "Conta por confirmar. Fale com o coordenador." : "Não foi possível entrar. Tente outra vez.");
    fecharFolha(); toast("Entrou");
  });
  $("#lNova", el).addEventListener("click", async () => {
    const d = dados();
    if (d.password.length < 6) return msg("A password precisa de pelo menos 6 caracteres.");
    msg("A criar conta…");
    const { data, error } = await sb.auth.signUp(d);
    if (error) return msg(/registered|exists/i.test(error.message) ? "Este email já tem conta. Toque em Entrar." : "Não foi possível criar a conta: " + error.message);
    if (!data.session) return msg("Conta criada, mas precisa de confirmação. Fale com o coordenador.");
    fecharFolha(); toast("Conta criada");
  });
}

// ---------- arranque ----------
let meuId = null;
const COLS_PUBLICAS = ["equipas", "exercicios", "plano", "sessoes", "alteracoes", "avaliacoes"];
const COLS_EQUIPA = ["notas", "atletas", "pessoas", "planos", "material", "planeadas", "semanas"];
S.acessos = {};
async function carregar(col) {
  const out = {};
  for (let de = 0; ; de += 1000) {
    const { data, error } = await sb.from(col).select(col === "acessos" ? "id,papel,nome" : "id,data").range(de, de + 999);
    if (error) { console.error("Erro ao carregar " + col, error); toast("Não foi possível carregar os dados: " + erroPT(error)); break; }
    if (!data) break;
    data.forEach(r => out[r.id] = col === "acessos" ? { papel: r.papel, nome: r.nome } : r.data);
    if (data.length < 1000) break;
  }
  S[col] = out;
}
async function definirPapel() {
  role = { nivel: "view", nome: "Consulta" }; meuId = sessao?.user?.id || null;
  if (!sessao) return;
  const { data } = await sb.from("acessos").select("papel").eq("id", sessao.user.email.toLowerCase()).maybeSingle();
  if (data?.papel === "coordenador") role = { nivel: "admin", nome: "Coordenação" };
  else if (data?.papel === "preparador") role = { nivel: "write", nome: "Preparação física" };
}
async function carregarTudo() {
  await definirPapel();
  const cols = COLS_PUBLICAS.concat(role.nivel !== "view" ? COLS_EQUIPA : []).concat(role.nivel === "admin" ? ["acessos", "reunioes"] : []);
  COLS_EQUIPA.concat(["acessos", "reunioes"]).forEach(c => { if (!cols.includes(c)) S[c] = {}; });
  await Promise.all(cols.map(carregar));
  render();
}
try { const t = localStorage.getItem("em_tab"); if (t) tab = t; } catch (e) {}
document.getElementById("role").addEventListener("click", () => { if (role.nivel === "admin") return escolherVista(); if (!sb) return; if (sessao) irPara("mais"); else formLogin(); });
render();
(async () => {
  const cfg = window.EM_CONFIG || {};
  if (!cfg.supabaseUrl || !cfg.supabaseKey || !window.supabase) return carregarDemo();
  sb = window.supabase.createClient(cfg.supabaseUrl, cfg.supabaseKey);
  sessao = (await sb.auth.getSession()).data.session;
  await carregarTudo();
  let ultimo = sessao?.user?.id || null;
  sb.auth.onAuthStateChange((ev, s2) => {
    sessao = s2;
    const id = s2?.user?.id || null;
    if (id !== ultimo) { ultimo = id; setTimeout(carregarTudo, 0); }
  });
  // atualizações em tempo real de outras pessoas
  sb.channel("alteracoes-bd").on("postgres_changes", { event: "*", schema: "public" }, p => {
    const col = p.table; if (!(col in S) || col === "acessos") return;
    if (p.eventType === "DELETE") delete S[col][p.old?.id];
    else S[col][p.new.id] = p.new.data;
    agendarRender();
  }).subscribe();
  document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") carregarTudo(); });
})();
</script>
